version: "3.1"

intents:
  - greet
  - affirm
  - deny
  - mood_great
  - mood_unhappy
  - bot_challenge
  - start_pricing
  - inform_cost
  - inform_operational_cost
  - inform_tax
  - inform_profit
  - inform_discount
  - goodbye

slots:
  cost_base:
    type: float
    mappings:
      - type: from_text

  operational_pct:
    type: float
    mappings:
      - type: from_text

  tax_pct:
    type: float
    mappings:
      - type: from_text

  profit_pct:
    type: float
    mappings:
      - type: from_text

  discount_pct:
    type: float
    mappings:
      - type: from_text


responses:
  utter_greet:
    - text: "Olá! Posso te ajudar a calcular o preço de um produto ou serviço."

  utter_ask_cost:
    - text: "Qual é o custo base do produto ou serviço?"

  utter_ask_operational:
    - text: "Qual o percentual de custos operacionais (%)?"

  utter_ask_tax:
    - text: "Qual o percentual de impostos (%)?"

  utter_ask_profit:
    - text: "Qual a margem de lucro desejada (%)?"

  utter_ask_discount:
    - text: "Existe algum desconto? Se não, digite 0."

  utter_goodbye:
    - text: "Cálculo finalizado. Até mais!"

  utter_iamabot:
    - text: "Sou um bot criado com Rasa 🤖"


actions:
  - action_calculate_price

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true


