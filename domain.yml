version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - mood_great
  - mood_unhappy
  - bot_challenge

responses:
  utter_greet:
  - text: "Hey! How are you?"

  utter_cheer_up:
  - text: "Here is something to cheer you up:"
    image: "https://i.imgur.com/nGF1K8f.jpg"

  utter_did_that_help:
  - text: "Did that help you?"

  utter_happy:
  - text: "Great, carry on!"

  utter_goodbye:
  - text: "Bye"

  utter_iamabot:
  - text: "I am a bot, powered by Rasa."

  version: "3.1"

intents:
  - greet
  - start_pricing
  - inform_cost
  - inform_operational_cost
  - inform_tax
  - inform_profit
  - inform_discount
  - goodbye

slots:
  cost_base:
    type: float
    influence_conversation: false

  operational_pct:
    type: float
    influence_conversation: false

  tax_pct:
    type: float
    influence_conversation: false

  profit_pct:
    type: float
    influence_conversation: false

  discount_pct:
    type: float
    influence_conversation: false

responses:
  utter_greet:
    - text: "Olá! Posso te ajudar a calcular o preço de um produto ou serviço."

  utter_ask_cost:
    - text: "Qual é o custo base do produto ou serviço?"

  utter_ask_operational:
    - text: "Qual o percentual de custos operacionais (%)?"

  utter_ask_tax:
    - text: "Qual o percentual de impostos (%)?"

  utter_ask_profit:
    - text: "Qual a margem de lucro desejada (%)?"

  utter_ask_discount:
    - text: "Existe algum desconto? Se não, digite 0."

  utter_goodbye:
    - text: "Cálculo finalizado. Até mais!"

actions:
  - action_calculate_price

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
