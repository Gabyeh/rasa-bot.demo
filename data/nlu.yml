version: "3.1"

nlu:
- intent: greet
  examples: |
    - oi
    - olá
    - bom dia
    - boa tarde
    - boa noite
    - quero calcular um preço

- intent: start_pricing
  examples: |
    - quero calcular o preço
    - calcular valor de produto
    - calcular preço de serviço
    - me ajude a precificar
    - preço do produto
- intent: inform_cost
  examples: |
    - 50
    - custa 120
    - o custo é 300

- intent: inform_operational_cost
  examples: |
    - 10%
    - 15
    - custos operacionais são 20

- intent: inform_tax
  examples: |
    - imposto é 8
    - 12%
    - 5 de imposto

- intent: inform_profit
  examples: |
    - lucro de 30
    - 40%
    - quero ganhar 25

- intent: inform_discount
  examples: |
    - 0
    - sem desconto
    - desconto de 10
    - 5%
- intent: goodbye
  examples: |
    - tchau!
    - até mais
    - até logo

- intent: affirm
  examples: |
    - sim
    - positivo
 - intent: deny
  examples: |
    - não
    - nunca
    - de forma alguma
    - negativo

- intent: mood_great
  examples: |
    - muito bom
    - incrivel
    - maravilhoso

- intent: mood_unhappy
  examples: |
    - infelizmente 
    - estou muito trsite
    
  - intent: bot_challenge
  examples: |
    - você é um bot?
    - você é um humano?
    - estou falando com um bot?
    - estou falando com um humano?
